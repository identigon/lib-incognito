# NOTE: Redis is NOT used by Incognito v1.0 (in-memory KeyTranslationStore only).
# This file is retained for the post-v1.0 RedisKeyTranslationStore roadmap item.
# Any persisted key store must be destroyed on successful completion (see SPECIFICATION.md §5.3).
version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: incognito-redis-dev
    ports:
      - "6379:6379"
    command: redis-server --save 60 1 --loglevel notice
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
