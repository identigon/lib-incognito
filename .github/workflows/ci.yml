name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out lib-incognito
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: lib-incognito

      # lib-incognito depends on io.github.dconneely:alterego:0.3.0-SNAPSHOT, which is not published
      # to a public repository — it must be built into the local Maven repo first (see PLAN.md
      # "Build prerequisite"). Adjust the repository/ref if the sibling repo moves.
      - name: Check out lib-alterego (local SNAPSHOT dependency)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: identigon/lib-alterego
          ref: v0.3.0
          path: lib-alterego

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 25

      - name: Publish lib-alterego to Maven local
        run: ./gradlew --no-daemon publishToMavenLocal
        working-directory: lib-alterego

      # ubuntu-latest runners ship with Docker, so the Testcontainers PostgreSQL E2Es run for real
      # here (they skip gracefully only where Docker is absent).
      - name: Build lib-incognito
        run: ./gradlew --no-daemon build
        working-directory: lib-incognito
