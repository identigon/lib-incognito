# Minimal code-hygiene hooks. Run with `prek` (no Python needed for the native hooks) or `pre-commit`.
# Kept deliberately small to start; SpotBugs + find-sec-bugs is a tracked follow-up (see PLAN.md).
repos:
  - repo: local
    hooks:
      - id: spotless-apply
        name: Spotless (auto-format)
        language: system
        entry: ./gradlew spotlessApply
        pass_filenames: false
        types: [java]

      - id: compile
        name: Compile
        language: system
        entry: ./gradlew compileJava compileTestJava
        pass_filenames: false
        types: [java]

      # SpotBugs and the test suite are intentionally omitted — too slow for a commit hook; run in CI.

  # Secret scanning — apt for a library whose whole point is that the salt/PII never leaks.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files  # guards the "fetch, don't vendor" discipline for large fixtures
